services:
  web:
    build: .
    image: depiflash:prod
    ports:
      - "3000"
    networks:
      - agent-net
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.depiflash.entrypoints=websecure"
        - "traefik.http.routers.depiflash.rule=Host(`depiflash.paragu-ai.com`)"
        - "traefik.http.routers.depiflash.tls=true"
        - "traefik.http.routers.depiflash.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.depiflash.loadbalancer.server.port=3000"
        - "traefik.docker.network=agent-net"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  agent-net:
    external: true
